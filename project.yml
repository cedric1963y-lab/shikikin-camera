name: Shikikin
options:
  bundleIdPrefix: jp.hayatosuzuki
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    DEVELOPMENT_TEAM: AJ24KB4M4W
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Shikikin:
    type: application
    platform: iOS
    sources:
      - path: Shikikin
        excludes: ["Configuration.storekit"]
      - path: Shikikin/Configuration.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.hayatosuzuki.shikikincamera
        PRODUCT_NAME: Shikikin
        INFOPLIST_FILE: Shikikin/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: NO
schemes:
  Shikikin:
    build: { targets: { Shikikin: all } }
    run:
      config: Debug
      storeKitConfiguration: Shikikin/Configuration.storekit
    archive: { config: Release }
